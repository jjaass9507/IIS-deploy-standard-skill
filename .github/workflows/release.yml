name: release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bundled sample project must keep passing the skill's own self-check.
      - name: Self-check the sample project
        run: python python-iis-deploy-standard/scripts/self_check.py python-iis-deploy-standard/assets/sample-app

      - name: Sample project tests
        working-directory: python-iis-deploy-standard/assets/sample-app
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          python -m pytest -q

      - name: Internal agent integration skill tests
        working-directory: internal-agent-integration
        run: |
          python -m pip install --quiet requests pillow pytest
          python -m pytest -q assets/tests
          python -m py_compile scripts/selftest.py scripts/label_banner.py

      - name: People and access skill tests
        working-directory: platform-people-access
        run: |
          python -m pip install --quiet sqlalchemy pytest
          python -m pytest -q assets/tests

      - name: Job packaging skill (scaffold every DB combination, test, check)
        run: |
          set -e
          for db in sqlserver oracle sqlserver,oracle none; do
            out="$RUNNER_TEMP/job_${db/,/_}"
            python python-job-packaging/scripts/scaffold.py "$out" --app sample_job --db "$db" --description "sample job"
            (cd "$out" && python -m unittest discover -s tests -t .)
            python python-job-packaging/scripts/check_project.py "$out"
            if grep -rIl "pms_ingest\|PmsIngest" "$out"; then echo "reference name leaked into template"; exit 1; fi
          done

      - name: Anti-AI-Slop UI skill tests
        working-directory: anti-ai-slop-ui
        run: |
          python -m py_compile scripts/devibe_scan.py scripts/slop_checker.py
          python -m unittest discover -s assets/tests -v

      - name: Validate SKILL.md front matter
        run: |
          python - <<'PY'
          import re, sys
          for skill in ("python-iis-deploy-standard", "internal-agent-integration", "python-job-packaging", "platform-people-access", "anti-ai-slop-ui"):
              text = open(f"{skill}/SKILL.md", encoding="utf-8").read()
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m: sys.exit(f"{skill}/SKILL.md has no YAML front matter")
              fields = dict(line.split(":", 1) for line in m.group(1).splitlines() if ":" in line)
              for key in ("name", "description"):
                  if not fields.get(key, "").strip(): sys.exit(f"{skill}/SKILL.md front matter is missing {key}")
              if fields["name"].strip() != skill: sys.exit(f"{skill}: name must match the folder name")
          print("front matter ok")
          PY

      - name: Package
        run: |
          mkdir -p dist
          (cd . && zip -qr dist/python-iis-deploy-standard.skill python-iis-deploy-standard -x '*/__pycache__/*')
          cp dist/python-iis-deploy-standard.skill dist/python-iis-deploy-standard.zip
          (cd dist && sha256sum python-iis-deploy-standard.skill > python-iis-deploy-standard.skill.sha256)
          zip -qr dist/internal-agent-integration.skill internal-agent-integration -x '*/__pycache__/*' '*/.pytest_cache/*'
          cp dist/internal-agent-integration.skill dist/internal-agent-integration.zip
          (cd dist && sha256sum internal-agent-integration.skill > internal-agent-integration.skill.sha256)
          zip -qr dist/python-job-packaging.skill python-job-packaging -x '*/__pycache__/*'
          cp dist/python-job-packaging.skill dist/python-job-packaging.zip
          (cd dist && sha256sum python-job-packaging.skill > python-job-packaging.skill.sha256)
          zip -qr dist/platform-people-access.skill platform-people-access -x '*/__pycache__/*' '*/.pytest_cache/*'
          cp dist/platform-people-access.skill dist/platform-people-access.zip
          (cd dist && sha256sum platform-people-access.skill > platform-people-access.skill.sha256)
          zip -qr dist/anti-ai-slop-ui.skill anti-ai-slop-ui -x '*/__pycache__/*' '*/.pytest_cache/*'
          cp dist/anti-ai-slop-ui.skill dist/anti-ai-slop-ui.zip
          (cd dist && sha256sum anti-ai-slop-ui.skill > anti-ai-slop-ui.skill.sha256)

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.2.${{ github.run_number }}"
          gh release create "$tag" dist/python-iis-deploy-standard.skill dist/python-iis-deploy-standard.zip dist/python-iis-deploy-standard.skill.sha256 \
            dist/internal-agent-integration.skill dist/internal-agent-integration.zip dist/internal-agent-integration.skill.sha256 \
            dist/python-job-packaging.skill dist/python-job-packaging.zip dist/python-job-packaging.skill.sha256 \
            dist/platform-people-access.skill dist/platform-people-access.zip dist/platform-people-access.skill.sha256 \
            dist/anti-ai-slop-ui.skill dist/anti-ai-slop-ui.zip dist/anti-ai-slop-ui.skill.sha256 \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "python-iis-deploy-standard（規範 v1.2）build ${{ github.run_number }}" \
            --notes "部署規範 skill（python-iis-deploy-standard）、內部 Agent 串接 skill（internal-agent-integration）、排程打包 skill（python-job-packaging）、人員權限 skill（platform-people-access）與去 AI Slop 前端設計 skill（anti-ai-slop-ui）。下載 .skill（或內容相同的 .zip），安裝方式見 README。"
